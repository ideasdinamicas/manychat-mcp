[project]
name = "manychat-mcp"
version = "0.1.0"
description = "MCP Server for the ManyChat API — plug into Claude Desktop, Cursor, or any MCP client"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
manychat-mcp = "manychat_mcp.server:main_sync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
